name: Instrumented tests (DB migrations)

# The Room migration suites are the highest-consequence tests in the repo: the app
# is on schema 109 with 80+ registered migrations, and a broken chain corrupts a
# user's local database on upgrade with no way to hotfix it after the fact. Those
# tests already exist under app/src/androidTest but need a device, so until now
# nothing ever ran them.
#
# NOTE: this workflow is deliberately NOT wired into push or pull_request yet.
# It needs one successful manual run first, because an emulator job here has to
# build a debug APK, which pulls in the NDK + CMake native build and ~1.62 GB of
# tracked .so/model payloads. Validate it by hand, then decide whether it earns a
# place on PRs touching the DB.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-tests:
    name: Room migration suites
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Reclaim runner disk before a build that packages large native payloads.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # app/build.gradle.kts pins this exact NDK, and the debug APK needs it
      # because the app module has an externalNativeBuild/CMake configuration.
      - name: Install pinned NDK
        run: sdkmanager --install "ndk;29.0.14206865"

      # KVM must be writable or the emulator falls back to software rendering and
      # times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Scoped to the two migration classes on purpose. A full
      # connectedDebugAndroidTest also drags in the Compose UI suites, which are
      # slower and flakier on an emulator and are not what this job is protecting.
      - name: Run migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.example.llamadroid.data.db.AppDatabaseMigrationTest,com.example.llamadroid.tama.db.TamaDatabaseMigrationTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
