name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [master, Dev]
  pull_request:
    branches: [master, Dev]
  schedule:
    - cron: "24 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # --no-build-cache is required, not an optimisation choice.
      # `cache: gradle` restores ~/.gradle including the local build cache, and
      # `org.gradle.caching=true` is set in gradle.properties. On a cache hit
      # Gradle serves `:app:compileDebugKotlin` FROM-CACHE, no compilation
      # actually runs, and CodeQL then fails the whole scan with
      # "detected code written in Java/Kotlin but this run didn't build any of it".
      # That is why fast (~2 min) runs failed while slow (~15 min) runs passed.
      # Dependency caching still applies; only task output reuse is disabled.
      - name: Build Kotlin for CodeQL
        run: ./gradlew --no-daemon --no-build-cache :app:compileDebugKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
