android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# Serves Gradle, R8, and the Kotlin compiler (which runs in-process, below).
# Raised from the original 4g within a ~20g budget.
org.gradle.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Left at false deliberately: module-level parallelism would multiply peak heap
# across the 20 modules. workers.max raises task-level concurrency (dexing, R8,
# resource workers) instead, which is the cheaper win.
org.gradle.parallel=false
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
android.suppressUnsupportedCompileSdk=35
VERSION_NAME=0.9571
MOBILE_VERSION_CODE=95710
WEAR_VERSION_CODE=95711
